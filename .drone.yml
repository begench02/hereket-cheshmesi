kind: pipeline
type: docker
name: frontend-ci-cd

steps:
  - name: install && test
    image: node:20-alpine
    commands:
      - npm ci
      - npm run test
      - npm test || echo "no tests yet"
      - npm run build

  - name: docker-build
    image: plugins/docker
    settings:
      repo: registry.local/hereket-cheshmesi-frontend
      tags:
        - latest
      dockerfile: Dockerfile
      username:
        from_secret: registry_user
      password:
        from_secret: registry_password

  - name: deploy
    image: appleboy/ssh
    settings:
      host: your-server
      username: deploy
      key:
        from_secret: deploy_key
      script:
        - cd /opt/hereket-cheshmesi
        - docker compose pull frontend
        - docker compose up -d frontend

trigger:
  branch: 
    - main
  event:
    - push
